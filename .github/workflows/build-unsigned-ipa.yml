name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build (unsigned)
        working-directory: ios
        run: |
          set -euo pipefail
          xcodebuild \
            -project TallyTap.xcodeproj \
            -target TallyTap \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SYMROOT="$PWD/build" \
            CONFIGURATION_BUILD_DIR="$PWD/build/Release-iphoneos" \
            build

      - name: Package IPA
        run: |
          set -euo pipefail
          rm -rf Payload Money-unsigned.ipa
          mkdir -p Payload
          cp -R ios/build/Release-iphoneos/TallyTap.app Payload/
          zip -qry Money-unsigned.ipa Payload
          ls -lh Money-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Money-unsigned-ipa
          path: Money-unsigned.ipa
          retention-days: 14
